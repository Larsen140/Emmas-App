<style>
:root{
  --bg:#f6efe4; --surface:#fffaf3; --text:#3b2a1e; --accent:#a8754f; --soft:#ead7bd;

button,input,select,textarea{font:inherit;color:inherit}

const GH={
  get on(){return !!S.settings.token},
  async req(path,opt={}){
    const r=await fetch(`https://api.github.com/repos/${S.settings.repo}${path}`,{...opt,cache:'no-store',headers:{'Authorization':'Bearer '+S.settings.token.trim(),'Accept':opt.raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
    if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;e.write=opt.method==='PUT';throw e}
    return opt.raw?r.text():r.json();
  },
  async readJson(file){const r=await this.req(`/contents/${file}?t=${Date.now()}`);const bin=atob(r.content.replace(/\n/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return {data:JSON.parse(new TextDecoder().decode(bytes)),sha:r.sha}},
  async writeJson(file,data,sha,msg){const bytes=new TextEncoder().encode(JSON.stringify(data,null,1)+'\n');let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return this.req(`/contents/${file}`,{method:'PUT',body:JSON.stringify({message:msg,content:btoa(bin),sha})})}
};

function ghError(e){
  if(e.status===401)return 'Der Zugangscode ist ungültig oder abgelaufen. Bitte neu kopieren (Fehler 401).';
  if(e.step==='repo'&&(e.status===404||e.status===403))return 'Der Zugangscode sieht das Repo „emmas-app-daten“ nicht. Beim Token unter „Repository access“ → „Only select repositories“ → emmas-app-daten wählen (Fehler '+e.status+').';
  if(e.write&&(e.status===403||e.status===404))return 'Der Zugangscode darf nichts speichern. Beim Token „Contents“ auf „Read and write“ stellen (Fehler '+e.status+').';
  if(e.status===403||e.status===404)return 'Der Zugangscode darf die Dateien nicht lesen. Beim Token unter „Permissions“ „Contents: Read and write“ hinzufügen (Fehler '+e.status+').';
  return 'Keine Verbindung. Bist du online?'+(e.status?' (Fehler '+e.status+')':'');
}

  for(let i=0;i<3;i++){

      let data,sha;try{const r=await GH.readJson(file);data=r.data;sha=r.sha}catch(e){if(e.status!==404)throw e;data=JSON.parse(JSON.stringify(leer));sha=undefined}

/* ---------- Gemeinsame Daten: beide iPhones sehen dieselbe Einkaufsliste, Termine und To-dos ---------- */
// Liegt als gemeinsam.json im privaten Daten-Repo. Pro Eintrag gewinnt die neueste Änderung (u = Zeitstempel),
// Löschungen werden als "del" gemerkt, damit sie beim anderen Gerät auch verschwinden.
const SYNC_COLLS=['einkauf','termine','todos'];
let syncT,syncBusy=false,syncAgain=false,lastPull=0,renderLater=false;
const itemHash=o=>{const c={...o};delete c.u;return JSON.stringify(c)};
function localChanges(mark){
  const now=Date.now(),base=S.syncBase||{};let changed=false;S.syncTomb=S.syncTomb||{};
  for(const c of SYNC_COLLS){const b=base[c]||{},ids=new Set();
    for(const it of S[c]){ids.add(it.id);if(b[it.id]!==itemHash(it)){changed=true;if(mark)it.u=now}}
    for(const id of Object.keys(b))if(!ids.has(id)){changed=true;if(mark){S.syncTomb[c]=S.syncTomb[c]||{};S.syncTomb[c][id]=now}}}
  return changed;
}
function mergeShared(remote){
  const out={},alt=Date.now()-30*864e5;
  for(const c of SYNC_COLLS){
    const r=(remote&&remote[c])||{},m=new Map();
    for(const it of r.items||[])m.set(it.id,it);
    for(const it of S[c]){const x=m.get(it.id);if(!x||(it.u||0)>(x.u||0))m.set(it.id,it)}
    const del={...(r.del||{})};for(const [id,t] of Object.entries((S.syncTomb||{})[c]||{}))if(!(del[id]>=t))del[id]=t;
    for(const [id,t] of Object.entries(del)){const x=m.get(id);if(x&&(x.u||0)<=t)m.delete(id);if(t<alt)delete del[id]}
    const items=[...m.values()];if(c==='einkauf')items.sort((a,b)=>(b.added||0)-(a.added||0));
    out[c]={items,del};
  }
  return out;
}
async function syncShared(){
  if(!GH.on)return;if(syncBusy){syncAgain=true;return}syncBusy=true;
  try{
    for(let i=0;i<3;i++){
      localChanges(true);
      const snap=JSON.stringify(SYNC_COLLS.map(c=>S[c]));
      let remote=null,sha;try{const r=await GH.readJson('gemeinsam.json');remote=r.data;sha=r.sha}catch(e){if(e.status!==404)throw e}
      const merged=mergeShared(remote);
      const before=snap;
      if(JSON.stringify(SYNC_COLLS.map(c=>remote&&remote[c]))!==JSON.stringify(SYNC_COLLS.map(c=>merged[c]))){
        try{await GH.writeJson('gemeinsam.json',{...merged,aktualisiert:new Date().toISOString()},sha,'Gemeinsame Liste aktualisiert')}
        catch(e){if(e.status===409||e.status===422)continue;throw e}
      }

  const sc=o=>(o.exakt?-10:0)+(o.unpassend?20:0)+(o.rang??1)*2+head(o);

function suchbegriff(brand,name){const words=String(name||'').replace(/\d+([.,]\d+)?\s*(ml|l|g|kg|%|st(ück)?)\b/gi,'').split(/[\s,]+/).filter(w=>w.length>2);const head=words[words.length-1]||'';const b=String(brand||'').split(',')[0].trim();return [b,head].filter(Boolean).join(' ').trim()||name}

    <div class="fields">

      <div class="field"><label for="sc-laden">Laden</label>${storeSelect('sc-laden',S.settings.einkaufLaden!=='alle'?S.settings.einkaufLaden:'',true,'Günstigster (automatisch)')}</div>
    </div>
    <p class="note muted small" style="margin:0">Nach dem Hinzufügen sucht die App sofort Angebote und Preise – bei dm sogar genau dieses Produkt über den Strichcode. Ohne Laden zeigt sie dir, wo es am günstigsten ist.</p>

}

function suggestions(q){
  const n=norm(q);if(n.length<2)return [];
  const res=[];
  for(const o of validOffers()){if(!o.unpassend&&norm(o.titel+' '+o.produkt+' '+o.marke).includes(n))res.push({name:o.titel||o.produkt,laden:o.laden,preis:o.preis,alt:o.alterPreis,bis:o.bis,offer:true,o})}
  for(const o of normalPrices()){if(!o.unpassend&&norm(o.titel+' '+o.produkt).includes(n))res.push({name:o.titel,laden:o.laden,preis:o.preis,normal:true,o})}
  res.sort((a,b)=>a.preis-b.preis);
  const seen=new Set(res.map(r=>norm(r.name)+r.laden));
  for(const h of S.verlauf){if(norm(h.name).includes(n)&&!seen.has(norm(h.name)+(h.laden||''))){seen.add(norm(h.name)+(h.laden||''));res.push({name:h.name,laden:h.laden||'',preis:null})}}
  return res.slice(0,8);
}

      ${offs.length?offs.map(o=>{const off=o.alterPreis?Math.round((1-o.preis/o.alterPreis)*100):0;return `<div class="offer"><i class="dot" style="background:${lcol(o.laden)}"></i><div class="body"><div class="t">${esc(o.titel)}</div><div class="m">${esc(lname(o.laden))}${o.marke&&!norm(o.titel).includes(norm(o.marke))?' · '+esc(o.marke):''}${o.bis?' · bis '+fmtDate(o.bis,{weekday:'short',day:'numeric',month:'short'}):''}${o.grundpreis?` · ${eur(o.grundpreis)}/${esc(o.einheit||'Einheit')}`:''}</div>${off>0?`<span class="tag deal" style="margin-top:4px;display:inline-block">−${off} %</span>`:''}</div>

        <button class="icon-btn" data-act="offer-to-list" data-p="${esc(p.name)}" data-k="a" data-i="${p.angebote.indexOf(o)}" aria-label="Auf die Einkaufsliste">${ic('cart')}</button></div>`}).join('')
      :`<div class="offer"><div class="body"><div class="m">Diese Woche kein Angebot${sel!=='alle'?' bei '+esc(lname(sel)):''}.</div></div></div>`}
      ${(()=>{const np=(p.normalpreise||[]).filter(o=>!o.unpassend&&(sel==='alle'||o.laden===sel)&&S.settings.laeden.includes(o.laden));return np.length?`<div class="group-h">Normalpreise</div>${np.map(o=>`<div class="offer"><i class="dot" style="background:${lcol(o.laden)}"></i><div class="body"><div class="t">${esc(o.titel)}</div><div class="m">${esc(lname(o.laden))}${o.ki?` · <a href="${esc(o.quelle)}" target="_blank" rel="noopener" style="color:inherit">KI-Preis${o.info?' · '+esc(o.info):''} ↗</a>`:''}${o.grundpreis?` · ${eur(o.grundpreis)}/${esc(o.einheit||'Einheit')}`:''}</div></div>
        <div class="pr"><b style="color:var(--text)">${eur(o.preis)}</b></div>
        <button class="icon-btn" data-act="offer-to-list" data-p="${esc(p.name)}" data-k="n" data-i="${p.normalpreise.indexOf(o)}" aria-label="Auf die Einkaufsliste">${ic('cart')}</button></div>`).join('')}`:''})()}</div>`}).join('');
  }
  return head+status+storeChips(sel,'set-alad')+`<div class="cols"><div class="sec">${body}</div><div class="side">${watchHtml}</div></div>`;
}

/* ----- Termine ----- */
function occurs(e,d){if(e.date===d)return true;if(!e.rep||d<e.date)return false;
  if(e.rep==='w')return Math.round((new Date(d+'T12:00')-new Date(e.date+'T12:00'))/864e5)%7===0;
  if(e.rep==='m')return d.slice(8)===e.date.slice(8);if(e.rep==='y')return d.slice(5)===e.date.slice(5);return false}
function nextOcc(e,from){if(!e.rep)return e.date>=from?e.date:null;let d=new Date((e.date>from?e.date:from)+'T12:00');for(let i=0;i<400;i++){const ds=iso(d);if(occurs(e,ds))return ds;d.setDate(d.getDate()+1)}return null}
const REP={w:'wöchentlich',m:'monatlich',y:'jährlich'};
function evOn(d){return S.termine.filter(e=>occurs(e,d)).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
function vTermine(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const first=new Date(y,m,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const t=todayIso();let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=iso(d),evs=evOn(ds);
    cells+=`<button class="day ${d.getMonth()!==m?'out':''} ${ds===t?'today':''} ${ds===calSel?'sel':''}" data-act="sel-day" data-d="${ds}" aria-label="${d.toLocaleDateString('de-DE',{day:'numeric',month:'long'})}${evs.length?', '+evs.length+' Termine':''}">${d.getDate()}${evs.length?`<span class="dots">${evs.slice(0,3).map(e=>`<i style="background:${ds===calSel?'currentColor':e.color}"></i>`).join('')}</span>`:''}</button>`;
    if(i===34&&new Date(start.getTime()+35*864e5).getMonth()!==m)break;}
  const evRow=e=>`<div class="ev" data-act="edit-ev" data-id="${e.id}"><i class="stripe" style="background:${e.color}"></i><div class="time">${e.time?esc(e.time):'ganz&shy;tägig'}</div><div style="min-width:0;flex:1"><div class="t">${esc(e.title)}${e.rep?` <span class="rep">↻ ${REP[e.rep]}</span>`:''}</div>${e.ort||e.notiz?`<div class="m">${esc([e.ort,e.notiz].filter(Boolean).join(' · '))}</div>`:''}</div></div>`;
  const dayEv=evOn(calSel);
  const upcoming=S.termine.map(e=>({...e,date:nextOcc(e,t)})).filter(e=>e.date).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,8);
  const cal=`<div class="card pad"><div class="cal-head"><button class="icon-btn" data-act="cal-prev" aria-label="Vorheriger Monat">${ic('left')}</button><b>${calMonth.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><button class="icon-btn" data-act="cal-next" aria-label="Nächster Monat">${ic('right')}</button></div>
    <div class="cal-grid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>
    <div class="flex" style="margin-top:10px"><button class="btn ghost sm" data-act="cal-today">Heute</button><button class="btn sm right" data-act="new-ev">${ic('plus')}Termin</button></div></div>`;
  return `<div class="view-head"><h2>Termine</h2><span class="sub">${upcoming.length?upcoming.length+' anstehend':''}</span></div>
  <div class="cols"><div class="sec">${cal}
    <div class="group-h" style="padding:4px 4px 0">${fmtDate(calSel,{weekday:'long',day:'numeric',month:'long'})}</div>
    ${dayEv.length?`<div class="card list">${dayEv.map(evRow).join('')}</div>`:`<div class="card empty" style="padding:20px"><b style="font-size:16px">Nichts geplant</b><button class="btn ghost sm" style="margin-top:8px" data-act="new-ev">${ic('plus')}Termin an diesem Tag</button></div>`}
  </div><div class="side sec"><div class="group-h" style="padding:4px 4px 0">Als Nächstes</div>
    ${upcoming.length?`<div class="card list">${upcoming.map(e=>evRow(e).replace('<div class="time">',`<div class="time" style="min-width:58px">${fmtDate(e.date,{day:'numeric',month:'short'})}<br>`)).join('')}</div>`:`<div class="card empty" style="padding:20px">Keine anstehenden Termine.</div>`}
  </div></div>`;
}
function evSheet(e){
  const isNew=!e;e=e||{id:uid(),title:'',date:calSel,time:'',ort:'',notiz:'',color:EV_COLORS[0]};
  openSheet(`<div class="sheet-head"><h3>${isNew?'Neuer Termin':'Termin'}</h3><button class="icon-btn" data-act="close" aria-label="Schließen">${ic('x')}</button></div>

/* ---------- Sheets ---------- */
let sheetData={};
function openSheet(html){closeSheet(true);sheetData={};const s=document.createElement('div');s.className='scrim';s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div>${html}</div>`;s.addEventListener('click',e=>{if(e.target===s)closeSheet()});document.body.appendChild(s);const f=s.querySelector('input:not([type=hidden])');if(f&&!f.value&&matchMedia('(hover:hover)').matches)f.focus()}
function closeSheet(now){document.querySelectorAll('.scrim:not(.closing)').forEach(s=>{if(now||REDUCE){s.remove();return}s.classList.add('closing');s.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));setTimeout(()=>s.remove(),300)})}
// Sheet nach unten wegziehen
let sd=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.grab,.sheet-head');if(!h||e.target.closest('button'))return;const sh=h.closest('.sheet');if(sh.scrollTop>0)return;sd={sh,y:e.clientY,dy:0,id:e.pointerId};sh.classList.add('dragging')});
document.addEventListener('pointermove',e=>{if(!sd||e.pointerId!==sd.id)return;sd.dy=Math.max(0,e.clientY-sd.y);sd.sh.style.transform=`translateY(${sd.dy}px)`});
const endSd=()=>{if(!sd)return;const {sh,dy}=sd;sd=null;sh.classList.remove('dragging');if(dy>110)closeSheet();else sh.style.transform=''};
document.addEventListener('pointerup',endSd);document.addEventListener('pointercancel',endSd);
// Wischen in Listen: rechts = abhaken, links = löschen
let sw=null,swipedAt=0;
document.addEventListener('pointerdown',e=>{const r=e.target.closest('.row[data-swipe]');if(!r||e.target.closest('.check'))return;sw={r,x:e.clientX,y:e.clientY,dx:0,on:false,id:e.pointerId}});
document.addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.on){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4){sw.on=true;sw.r.classList.add('dragging');const box=sw.r.closest('.sw');if(box){clearTimeout(box._t);box.classList.add('swiping')}try{sw.r.setPointerCapture(e.pointerId)}catch(_){}}else{if(Math.abs(dy)>12)sw=null;return}}
  sw.dx=dx;const bg=sw.r.previousElementSibling;if(bg)bg.classList.toggle('del',dx<0);sw.r.style.transform=`translateX(${Math.max(-170,Math.min(170,dx))}px)`});
const endSw=()=>{if(!sw)return;const s=sw;sw=null;if(!s.on)return;s.r.classList.remove('dragging');{const box=s.r.closest('.sw');if(box)box._t=setTimeout(()=>box.classList.remove('swiping'),400)}swipedAt=Date.now();const id=s.r.dataset.id,kind=s.r.dataset.swipe;
  if(s.dx>90){s.r.style.transform='';const c=s.r.querySelector('.check');kind==='item'?toggleItem(id,c):toggleTodo(id,c)}
  else if(s.dx<-90){s.r.style.transform='translateX(-110%)';setTimeout(()=>kind==='item'?deleteItem(id,s.r.closest('.sw')):deleteTodo(id,s.r.closest('.sw')),160)}
  else s.r.style.transform=''};
document.addEventListener('pointerup',endSw);document.addEventListener('pointercancel',endSw);
function toggleItem(id,checkEl){const it=S.einkauf.find(x=>x.id===id);if(!it)return;it.done=!it.done;save();
  const row=checkEl&&checkEl.closest('.row');if(checkEl){checkEl.classList.toggle('on',it.done);checkEl.classList.remove('pop');void checkEl.offsetWidth;checkEl.classList.add('pop')}if(row)row.classList.toggle('done',it.done);
  const allDone=it.done&&S.einkauf.length&&S.einkauf.every(x=>x.done);if(allDone){confetti();toast('Alles im Wagen! ✿')}
  collapseThen(row&&row.closest('.sw'),render,380)}
function toggleTodo(id,checkEl){const x=S.todos.find(t=>t.id===id);if(!x)return;x.done=!x.done;x.doneAt=x.done?Date.now():null;save();
  const row=checkEl&&checkEl.closest('.row');if(checkEl){checkEl.classList.toggle('on',x.done);checkEl.classList.remove('pop');void checkEl.offsetWidth;checkEl.classList.add('pop')}if(row)row.classList.toggle('done',x.done);
  if(x.done&&S.todos.every(t=>t.done)){confetti();toast('Alles erledigt! ✿')}
  const leaves=S.settings.todoFilter!=='alle';leaves?collapseThen(row&&row.closest('.sw'),render,380):setTimeout(render,380)}
function deleteItem(id,el){const i=S.einkauf.findIndex(x=>x.id===id);if(i<0)return;const [it]=S.einkauf.splice(i,1);save();closeSheet();
  collapseThen(el,render);undoToast(`„${it.name}“ gelöscht`,()=>{S.einkauf.splice(Math.min(i,S.einkauf.length),0,it);save();render()})}
function deleteTodo(id,el){const i=S.todos.findIndex(x=>x.id===id);if(i<0)return;const [x]=S.todos.splice(i,1);save();closeSheet();
  collapseThen(el,render);undoToast('Aufgabe gelöscht',()=>{S.todos.splice(Math.min(i,S.todos.length),0,x);save();render()})}
const val=id=>{const e=document.getElementById(id);return e?e.value:''};

/* ---------- Aktionen ---------- */
document.addEventListener('click',async e=>{
  const tb=e.target.closest('[data-tab]');if(tb){closeSheet();go(tb.dataset.tab);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  if(Date.now()-swipedAt<400&&b.closest('.row[data-swipe]'))return;
  const a=b.dataset.act,id=b.dataset.id;
  const item=()=>S.einkauf.find(x=>x.id===id);
  switch(a){
    case'close':closeSheet();break;
    // Einkauf
    case'set-elad':S.settings.einkaufLaden=b.dataset.v;save();render();break;
    case'toggle-item':toggleItem(id,b);break;
    case'scan':openScanner();break;
    case'push-on':pushEnable(b);break;
    case'push-gate':{await Notification.requestPermission().catch(()=>'default');updatePushGate();if(Notification.permission==='granted')toast('Danke ✿',2000);break}
    case'push-off':pushDisable();break;
    case'push-pref':{const k=b.dataset.v;S.push.prefs=S.push.prefs||{updates:true,termine:true,todos:true};S.push.prefs[k]=S.push.prefs[k]===false;save();render();pushUpdate(a=>{a.prefs=S.push.prefs},'Benachrichtigungen: Einstellungen');break}
    case'push-test':{b.disabled=true;const ok=await pushUpdate(a=>{a.test=true},'Testnachricht angefordert');if(ok)toast('Die Testnachricht kommt in etwa einer Minute');break}
    case'scan-close':closeScanner();break;
    case'scan-manual':{closeScanner();openSheet(`<div class="sheet-head"><h3>Nummer eintippen</h3><button class="icon-btn" data-act="close" aria-label="Schließen">${ic('x')}</button></div><div class="field"><label for="sc-code">Strichcode-Nummer (unter den Strichen)</label><input id="sc-code" inputmode="numeric" pattern="[0-9]*" placeholder="z. B. 4005808262175"></div><div class="sheet-actions"><span></span><button class="btn" data-act="scan-lookup">Suchen</button></div>`);setTimeout(()=>{const f=document.getElementById('sc-code');f&&f.focus()},350);break}
    case'scan-lookup':lookupCode(val('sc-code'));break;
    case'scan-add':{const nm=val('sc-name').trim();if(!nm){toast('Bitte einen Namen eingeben');break}const su=val('sc-such').trim()||nm,ld=val('sc-laden');
      addItem(nm,ld,{produkt:su,ean:b.dataset.ean});closeSheet();if(tab!=='einkauf')go('einkauf');else render();toast(`„${nm}“ hinzugefügt`);break}
    case'step':{const f=document.getElementById(b.dataset.t);if(f)f.value=Math.max(1,(parseInt(f.value)||1)+(+b.dataset.d));break}
    case'quick-add':{addItem(b.dataset.n,b.dataset.l);toast(`„${b.dataset.n}“ hinzugefügt`);render();break}
    case'share-list':{const text=shareText();
      try{if(navigator.share){await navigator.share({title:'Einkaufsliste',text})}else{await navigator.clipboard.writeText(text);toast('Liste kopiert')}}catch(err){if(err&&err.name!=='AbortError'){try{await navigator.clipboard.writeText(text);toast('Liste kopiert')}catch(_){}}}
      break}
    case'edit-item':{const it=item();if(it)itemSheet(it);break}
    case'save-item':{const it=item();if(!it)break;const name=val('f-name').trim();if(!name){toast('Bitte einen Namen eingeben');break}
      const laden=val('f-laden');if(laden!==it.laden)it.wahl=null;
      if(norm(name)!==norm(it.name)){it.produkt=name;it.wahl=null;queueWatch(name)}
      Object.assign(it,{name,menge:Math.max(1,parseInt(val('f-menge'))||1),laden,notiz:val('f-notiz').trim()});
      save();closeSheet();render();break}
    case'auto-price':{const it=item();if(it){it.wahl=null;it.preis=null;it.angebotPreis=null;it.angebotBis=null;save();render();itemSheet(it)}break}
    case'use-offer':{const it=item(),o=sheetData.offers&&sheetData.offers[+b.dataset.i];if(!it||!o)break;
      const nm=val('f-name').trim()||it.name,mg=Math.max(1,parseInt(val('f-menge'))||1),nt=val('f-notiz').trim();
      Object.assign(it,{name:nm,menge:mg,notiz:nt,wahl:wahlVon(o),preis:null,angebotPreis:null,angebotBis:null});save();render();itemSheet(it);break}
    case'del-item':deleteItem(id,null);break;
    case'watch-item':{const it=item();if(it){b.disabled=true;await addWatch(it.name);closeSheet();render()}break}
    case'clear-done':{const before=S.einkauf.slice(),n=S.einkauf.filter(x=>x.done).length;S.einkauf=S.einkauf.filter(x=>!x.done);save();render();undoToast(n+' Artikel entfernt',()=>{S.einkauf=before;save();render()});break}
    case'pick-sugg':{const s=$('#sugg')._list[+b.dataset.i];if(!s)break;
      addItem(s.o?s.o.produkt:s.name,s.laden,s.o?{wahl:wahlVon(s.o)}:{});suggQ='';render();toast(`„${s.name}“ hinzugefügt`);break}
    // Angebote
    case'set-alad':S.settings.angLaden=b.dataset.v;save();render();break;
    case'unwatch':b.disabled=true;await removeWatch(b.dataset.name);break;
    case'search-now':{b.disabled=true;const ok=await editMerkliste(d=>{d.suche=new Date().toISOString()},'Suche per Hand gestartet');if(ok){toast('Suche gestartet');startPolling()}else render();break}
    case'reload':await loadRemote(false);if(syncState==='ok')toast('Alles aktuell');break;
    case'offer-to-list':{const d=b.dataset,e=(S.angebote?.produkte||[]).find(x=>x.name===d.p);const o=e&&(d.k==='n'?e.normalpreise:e.angebote)[+d.i];if(!o)break;
      addItem(e.name,o.laden,{wahl:wahlVon({...o,normal:d.k==='n'})});toast(`${o.titel} (${lname(o.laden)}) ist auf der Einkaufsliste`);break}
    // Termine
    case'sel-day':calSel=b.dataset.d;{const d=new Date(calSel+'T12:00');if(d.getMonth()!==calMonth.getMonth()){calMonth=new Date(d.getFullYear(),d.getMonth(),1)}}render();break;
    case'cal-prev':calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);render();break;
    case'cal-next':calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);render();break;
    case'cal-today':calSel=todayIso();calMonth=new Date();calMonth.setDate(1);render();break;
    case'new-ev':evSheet(null);break;
    case'edit-ev':{const ev=S.termine.find(x=>x.id===id);if(ev)evSheet(ev);break}
    case'pick-evcol':sheetData.evColor=b.dataset.c;document.querySelectorAll('#e-colors button').forEach(x=>x.setAttribute('aria-pressed',x===b));break;
    case'save-ev':{const title=val('e-title').trim(),date=val('e-date');if(!title||!date){toast('Titel und Datum bitte');break}
      const ev={id,title,date,time:val('e-time'),rep:val('e-rep')||'',ort:val('e-ort').trim(),notiz:val('e-notiz').trim(),color:sheetData.evColor||EV_COLORS[0]};
      const i=S.termine.findIndex(x=>x.id===id);if(i>=0)S.termine[i]=ev;else S.termine.push(ev);
      calSel=date;calMonth=new Date(date.slice(0,4),+date.slice(5,7)-1,1);save();closeSheet();render();break}
    case'del-ev':{const before=S.termine.slice();S.termine=S.termine.filter(x=>x.id!==id);save();closeSheet();render();undoToast('Termin gelöscht',()=>{S.termine=before;save();render()});break}
    // To-dos
    case'toggle-todo':toggleTodo(id,b);break;
    case'due-chip':{const f=document.getElementById('t-due');if(!f)break;const v=b.dataset.v,d=new Date();
      if(v==='')f.value='';else{if(v==='we'){d.setDate(d.getDate()+((6-d.getDay()+7)%7))}else if(v==='nw'){d.setDate(d.getDate()+((8-d.getDay())%7||7))}else d.setDate(d.getDate()+(+v));f.value=iso(d)}
      document.querySelectorAll('[data-act=due-chip]').forEach(x=>x.setAttribute('aria-pressed',x===b));break}
    case'edit-todo':{const x=S.todos.find(t=>t.id===id);if(x)todoSheet(x);break}
    case'save-todo':{const x=S.todos.find(t=>t.id===id);if(!x)break;const text=val('t-text').trim();if(!text){toast('Bitte einen Text eingeben');break}Object.assign(x,{text,due:val('t-due')||null,prio:+val('t-prio')||1});save();closeSheet();render();break}
    case'del-todo':deleteTodo(id,null);break;
    case'todo-filter':S.settings.todoFilter=b.dataset.v;save();render();break;
    case'clear-todos':{const before=S.todos.slice();S.todos=S.todos.filter(x=>!x.done);save();render();undoToast('Erledigte gelöscht',()=>{S.todos=before;save();render()});break}
    // Einstellungen
    case'set-theme':S.settings.theme=b.dataset.v;S.settings.accent=null;save();applyTheme();render();break;
    case'set-accent':S.settings.accent=b.dataset.v||null;save();applyTheme();render();break;
    case'set-auto':S.settings.autoSuche=!!b.dataset.v;save();render();break;
    case'set-mode':S.settings.mode=b.dataset.v;save();applyTheme();render();break;
    case'set-pattern':S.settings.pattern=b.dataset.v;save();applyTheme();render();break;
    case'set-bg':S.settings.bg=b.dataset.v||null;save();applyTheme();render();break;

  }

function confirmTwice(b,msg){if(b.dataset.armed){return true}b.dataset.armed=1;const t=b.textContent;b.textContent=msg;setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t}},3500);return false}
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form;
  if(k==='add-item'){const n=val('addName').trim();if(!n)return;addItem(n,val('addLaden'));suggQ='';render();const inp=$('#addName');inp&&inp.focus();toast(`„${n}“ hinzugefügt`)}
  if(k==='add-todo'){const t=val('todoText').trim();if(!t)return;S.todos.unshift({id:uid(),text:t,done:false,prio:1,due:null,created:Date.now()});if(S.settings.todoFilter==='erledigt')S.settings.todoFilter='offen';save();render();const inp=$('#todoText');inp&&inp.focus()}

document.addEventListener('focusin',e=>{if(e.target.id==='addName')showSugg()});
document.addEventListener('pointerdown',e=>{const box=$('#sugg');if(box&&!box.hidden&&!e.target.closest('.addbar'))box.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeScanner();closeSheet()}});
let lastLoad=0;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){header();if(GH.on&&Date.now()-lastLoad>5*60e3){lastLoad=Date.now();loadRemote(true)}}});

/* ---------- Nur vom Home-Bildschirm ---------- */
const STANDALONE=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
const UA=navigator.userAgent,IPAD=/iPad/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),IOS=IPAD||/iPhone|iPod/.test(UA),ANDROID=/Android/.test(UA);
const MUST_INSTALL=!STANDALONE&&(IOS||ANDROID)&&location.protocol==='https:';
let installEvt=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;const b=document.getElementById('instBtn');if(b)b.hidden=false});
function showInstall(){
  const share='<svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
  const plus='<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
  const notSafari=IOS&&/CriOS|FxiOS|EdgiOS|OPiOS/.test(UA);
  const steps=IOS?[
    `Tippe auf ${share} <b>Teilen</b> ${IPAD?'oben rechts':'unten in der Leiste'}${notSafari?' (oder öffne den Link in Safari)':''}`,
    `Scrolle nach unten und tippe auf ${plus} <b>Zum Home-Bildschirm</b>`,
    `Tippe oben rechts auf <b>Hinzufügen</b>`,
    `Öffne <b>Emmas Planner</b> auf deinem Home-Bildschirm`]
   :[`Tippe oben rechts auf <b>⋮</b> (Menü)`,`Tippe auf <b>App installieren</b> oder <b>Zum Startbildschirm hinzufügen</b>`,`Öffne <b>Emmas Planner</b> auf deinem Startbildschirm`];
  const d=document.createElement('div');d.className='install';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');
  d.innerHTML=`<div class="install-card"><div class="logo"><span>E</span></div><h2>Emmas Planner</h2>
    <p>Füge die App zu deinem Home-Bildschirm hinzu. Erst dann funktioniert sie richtig: im Vollbild, mit Speicher und schnellen Updates.</p>
    <div class="steps card">${steps.map((t,i)=>`<div class="step"><span class="n">${i+1}</span><span>${t}</span></div>`).join('')}</div>
    <button class="btn" id="instBtn" ${installEvt?'':'hidden'}>App installieren</button></div>
    ${IOS&&!IPAD&&!notSafari?'<div class="arrow" aria-hidden="true">↓</div>':''}`;
  document.body.appendChild(d);
  d.querySelector('#instBtn').onclick=async()=>{if(installEvt){installEvt.prompt();installEvt=null}};
}

/* ---------- Mitteilungen sind Pflicht (nur in der Home-Bildschirm-App) ---------- */
const mustPush=()=>STANDALONE&&PUSH_OK&&Notification.permission!=='granted';
function showPushGate(){
  if(document.querySelector('.install.pushgate'))return updatePushGate();
  const d=document.createElement('div');d.className='install pushgate';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');
  d.innerHTML=`<div class="install-card"><div class="logo"><span>E</span></div><h2>Mitteilungen erlauben</h2><div id="pgBody"></div></div>`;
  document.body.appendChild(d);updatePushGate();
}
function updatePushGate(){
  const g=document.querySelector('.install.pushgate');if(!g)return;
  if(!mustPush()){g.remove();if(GH.on&&!(S.push&&S.push.on))pushEnable();return}
  const denied=Notification.permission==='denied';
  g.querySelector('#pgBody').innerHTML=denied?`<p style="margin:0 0 14px;color:var(--muted)">Mitteilungen sind ausgeschaltet. Ohne sie kann Emmas Planner nicht an Termine und To-dos erinnern.</p>
    <div class="steps card">${[`Öffne die <b>Einstellungen</b> auf deinem ${IPAD?'iPad':'iPhone'}`,`Tippe auf <b>Mitteilungen</b>`,`Wähle <b>Emmas Planner</b>`,`Schalte <b>Mitteilungen erlauben</b> ein`,`Komm zurück in die App`].map((t,i)=>`<div class="step"><span class="n">${i+1}</span><span>${t}</span></div>`).join('')}</div>`
   :`<p style="margin:0 0 14px;color:var(--muted)">Damit dich Emmas Planner an Termine, fällige To-dos und neue Updates erinnern kann, braucht die App deine Erlaubnis.</p>
    <div class="steps card">${[['📅','Erinnerung etwa 1 Stunde vor Terminen'],['☀️','Morgens: was heute ansteht'],['🆕','Hinweis auf neue Updates']].map(([e,t])=>`<div class="step"><span class="n" style="background:none;font-size:20px">${e}</span><span>${t}</span></div>`).join('')}</div>
    <button class="btn" style="margin-top:16px;width:100%" data-act="push-gate">${ic('bell')}Mitteilungen erlauben</button>`;
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&document.querySelector('.install.pushgate'))updatePushGate()});

/* ---------- Start ---------- */
applyTheme();render();
if(MUST_INSTALL)showInstall();
else if(mustPush())showPushGate();
else setTimeout(pushCheck,2500);
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{try{const u=new URL(e.data&&e.data.open);const t=u.searchParams.get('tab');if(t)go(t)}catch(_){}});
if(GH.on&&!MUST_INSTALL)setTimeout(()=>syncPlan(true),800);
if(GH.on&&!MUST_INSTALL)setTimeout(wecker,5000);
if(GH.on&&!MUST_INSTALL){setSync('laden');lastLoad=Date.now();loadRemote(true)}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
/* Schnelle Updates: beim Öffnen, beim Zurückkehren und alle 2 Minuten nach einer neuen Version schauen */
let updT=0,updReady=false;
async function checkUpdate(){
  if(location.protocol!=='https:'||Date.now()-updT<20e3)return;updT=Date.now();
  try{
    const r=await fetch('index.html?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const BUILD='([^']+)'/);
    // nur bei neuerer Version, und höchstens einmal pro Version neu laden (keine Endlosschleife)
    if(m&&m[1]>BUILD){let tried='';try{tried=sessionStorage.getItem('ep-upd')||''}catch(e){}if(tried===m[1])return;try{sessionStorage.setItem('ep-upd',m[1])}catch(e){}applyUpdate()}
  }catch(e){}
}
function applyUpdate(){
  const busy=document.querySelector('.scrim')||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
  if(!busy){location.reload();return}
  if(updReady)return;updReady=true;
  const t=document.createElement('button');t.className='toast';t.style.border='0';t.style.cursor='pointer';t.textContent='Neue Version da – tippen zum Laden';t.onclick=()=>location.reload();document.body.appendChild(t);
}
setTimeout(checkUpdate,1500);setInterval(checkUpdate,120e3);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
</script>
</body>
</html>
