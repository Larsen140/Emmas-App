const KEY='emmas-planner-v1';

const LAEDEN={aldi:['Aldi Süd','#2f62b3'],lidl:['Lidl','#e3a600'],hit:['HIT','#e05a2b'],edeka:['Edeka','#2b7f8f'],rewe:['REWE','#c41a2a'],dm:['dm','#7a52a8'],rossmann:['Rossmann','#c0306f']};

function isDark(){const st=S.settings,t=THEMES[st.theme]||THEMES.latte;return t.dark||st.mode==='dunkel'||(st.mode==='auto'&&mq.matches)}
function themeVars(){
  const st=S.settings,t=THEMES[st.theme]||THEMES.latte,dark=isDark();
  let v={...t};if(st.accent)v.accent=st.accent;
  if(dark&&!t.dark){v.bg='#1d1814';v.surface='#29221d';v.text='#f2e8dc';v.soft=`color-mix(in srgb,${v.accent} 30%,#1d1814)`;v.accent=`color-mix(in srgb,${v.accent} 78%,#fff)`}
  return {v,dark};
}
function applyTheme(){
  const {v,dark}=themeVars(),r=document.documentElement,st=S.settings;
  ['bg','surface','text','accent','soft'].forEach(k=>r.style.setProperty('--'+k,v[k]));
  r.toggleAttribute('data-dark',dark);
  const patCol=dark?'#ffffff':(st.accent||(THEMES[st.theme]||THEMES.latte).accent);
  r.style.setProperty('--pat-img',patternImg(st.pattern,patCol));
  r.style.setProperty('--pat-size',PSIZE[st.pattern]||'28px');

}

/* ---------- GitHub-Verbindung ---------- */
const GH={
  get on(){return !!S.settings.token},
  async req(path,opt={}){
    const r=await fetch(`https://api.github.com/repos/${S.settings.repo}${path}`,{...opt,cache:'no-store',headers:{'Authorization':'Bearer '+S.settings.token.trim(),'Accept':opt.raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
    if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
    return opt.raw?r.text():r.json();
  },
  async readJson(file){const r=await this.req(`/contents/${file}?t=${Date.now()}`);const bin=atob(r.content.replace(/\n/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return {data:JSON.parse(new TextDecoder().decode(bytes)),sha:r.sha}},
  async writeJson(file,data,sha,msg){const bytes=new TextEncoder().encode(JSON.stringify(data,null,1)+'\n');let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return this.req(`/contents/${file}`,{method:'PUT',body:JSON.stringify({message:msg,content:btoa(bin),sha})})}
};
let syncState='';// '', 'ok', 'laden', 'fehler'
let searching=null;// Zeitpunkt, seit dem auf neue Angebote gewartet wird
function setSync(st,txt){syncState=st;const el=document.getElementById('sync');if(!GH.on){el.hidden=true;return}el.hidden=false;el.className='sync'+(st==='ok'?' on':st==='fehler'?' err':'');el.querySelector('span').textContent=txt||({ok:'Verbunden',laden:'Lädt…',fehler:'Offline'}[st]||'')}
function ghError(e){if(e.status===401)return 'Der Token ist ungültig oder abgelaufen.';if(e.status===404||e.status===403)return 'Kein Zugriff auf das Daten-Repo. Stimmen Token und Repo?';return 'Keine Verbindung. Bist du online?'}
async function loadRemote(quiet){
  if(!GH.on)return;
  setSync('laden');
  try{
    const [m,a]=await Promise.all([GH.readJson('merkliste.json'),GH.readJson('angebote.json')]);
    S.merkliste=m.data;S.angebote=a.data;save();
    if(searching&&a.data.aktualisiert&&new Date(a.data.aktualisiert).getTime()>searching-60e3){searching=null;toast('Neue Angebote sind da ✿')}
    setSync('ok');
  }catch(e){setSync('fehler');if(!quiet)toast(ghError(e))}
  if(['angebote','einkauf'].includes(tab))render();
}
async function editMerkliste(fn,msg){
  if(!GH.on){toast('Erst in den Optionen verbinden');return false}
  for(let i=0;i<3;i++){
    try{
      const {data,sha}=await GH.readJson('merkliste.json');
      fn(data);data.aktualisiert=new Date().toISOString();
      await GH.writeJson('merkliste.json',data,sha,msg);
      S.merkliste=data;save();return true;
    }catch(e){if(e.status!==409&&e.status!==422){toast(ghError(e));return false}}
  }
  toast('Speichern hat nicht geklappt, bitte nochmal');return false;
}
let pollT;
function startPolling(){
  searching=Date.now();clearInterval(pollT);
  pollT=setInterval(()=>{if(!searching||Date.now()-searching>8*60e3){if(searching){searching=null;toast('Suche dauert länger – schau später nochmal rein');render()}clearInterval(pollT);return}loadRemote(true)},25e3);
  render();
}
async function addWatch(name){
  name=name.trim();if(!name)return;
  const exists=(S.merkliste?.produkte||[]).some(p=>norm(p.name||p)===norm(name));
  if(exists){toast(`„${name}“ ist schon auf der Merkliste`);return}
  const ok=await editMerkliste(d=>{d.produkte=d.produkte||[];d.produkte.push({name})},`Merkliste: ${name} hinzugefügt`);
  if(ok){toast(`„${name}“ wird jetzt gesucht…`);startPolling()}
}
async function removeWatch(name){
  const ok=await editMerkliste(d=>{d.produkte=(d.produkte||[]).filter(p=>norm(p.name||p)!==norm(name))},`Merkliste: ${name} entfernt`);
  if(ok){if(S.angebote)S.angebote.produkte=(S.angebote.produkte||[]).filter(p=>norm(p.name)!==norm(name));save();render()}
}

/* ---------- Angebote-Hilfen ---------- */
function validOffers(){
  const out=[],t=todayIso();
  for(const p of S.angebote?.produkte||[])for(const o of p.angebote||[]){if(!o.bis||o.bis>=t)out.push({...o,produkt:p.name})}
  return out;
}
function matchOffers(name,laden){
  const n=norm(name);if(!n)return [];
  return validOffers().filter(o=>{if(laden&&o.laden!==laden)return false;const pn=norm(o.produkt),tn=norm(o.titel);
    return pn===n||tn===n||(pn&&(n.includes(pn)||pn.includes(n)))||tn.includes(n)}).sort((a,b)=>a.preis-b.preis);
}
function effPrice(it){
  const t=todayIso();
  const manual=it.angebotPreis!=null&&(!it.angebotBis||it.angebotBis>=t)?{preis:it.angebotPreis,bis:it.angebotBis,quelle:'eigen'}:null;
  const deal=manual,normal=it.preis;
  if(deal&&(normal==null||deal.preis<=normal))return {preis:deal.preis,normal,deal};
  return {preis:normal,normal,deal:null};
}
const qty=it=>Math.max(1,Number(it.menge)||1);

function vEinkauf(){
  const sel=S.settings.einkaufLaden;
  const items=S.einkauf.filter(it=>sel==='alle'||it.laden===sel);
  const open=items.filter(i=>!i.done),done=items.filter(i=>i.done);
  // Gruppen nach Laden
  const groups={};
  for(const it of open){(groups[it.laden||'']=groups[it.laden||'']||[]).push(it)}
  const order=[...S.settings.laeden,''].filter(k=>groups[k]);
  Object.keys(groups).forEach(k=>{if(!order.includes(k))order.push(k)});
  const row=it=>{const p=effPrice(it),q=qty(it);return `<div class="row ${it.done?'done':''}">
    <button class="check ${it.done?'on':''}" data-act="toggle-item" data-id="${it.id}" aria-label="${esc(it.name)} ${it.done?'nicht ':''}abhaken">${ic('ok')}</button>
    <div class="body" data-act="edit-item" data-id="${it.id}"><div class="t">${q>1?`<span class="muted">${q}×</span> `:''}${esc(it.name)}</div>
      <div class="m">${it.notiz?`<span>${esc(it.notiz)}</span>`:''}${p.deal?`<span class="tag deal">Angebot${p.deal.bis?' bis '+fmtDate(p.deal.bis):''}</span>`:(!it.done&&it.laden&&matchOffers(it.name,it.laden).length?'<span class="tag acc">Angebote im Prospekt</span>':'')}${it.laden&&sel==='alle'&&it.done?`<span>${esc(lname(it.laden))}</span>`:''}</div></div>
    <div class="price">${p.preis!=null?`<b class="${p.deal?'deal':''}">${eur(p.preis*q)}</b>${p.deal&&p.normal!=null&&p.normal>p.preis?`<s>${eur(p.normal*q)}</s>`:''}`:`<span class="muted small" data-act="edit-item" data-id="${it.id}">+ Preis</span>`}</div></div>`};
  const sum=arr=>arr.reduce((s,it)=>{const p=effPrice(it);return s+(p.preis||0)*qty(it)},0);
  let listHtml='';
  if(!items.length){listHtml=`<div class="card empty"><div class="em">🧺</div><b>Die Liste ist leer</b>Tippe oben ein, was du brauchst. Vorschläge kommen aus deinen Angeboten und früheren Einkäufen.</div>`}
  else{
    listHtml=`<div class="card list">${order.map(k=>`<div class="group-h"><i class="dot" style="background:${k?lcol(k):'var(--muted)'}"></i>${esc(k?lname(k):'Ohne Laden')}<b>${sum(groups[k])?eur(sum(groups[k])):''}</b></div>${groups[k].map(row).join('')}`).join('')}
    ${done.length?`<div class="group-h">Im Wagen · ${done.length}<button class="btn ghost sm right" data-act="clear-done" style="text-transform:none;letter-spacing:0">Abgehakte löschen</button></div>${done.map(row).join('')}`:''}</div>`;
  }
  // Preisrechner
  const all=S.einkauf.filter(it=>sel==='alle'||it.laden===sel);
  const total=sum(all),inCart=sum(all.filter(i=>i.done)),rest=total-inCart;
  const saved=all.reduce((s,it)=>{const p=effPrice(it);return s+(p.deal&&p.normal!=null&&p.normal>p.preis?(p.normal-p.preis)*qty(it):0)},0);
  const noPrice=all.filter(it=>effPrice(it).preis==null).length;
  const byStore={};all.forEach(it=>{const k=it.laden||'';byStore[k]=(byStore[k]||0)+(effPrice(it).preis||0)*qty(it)});
  const calc=`<div class="card pad calc"><h3>Preisrechner</h3>
    <div class="muted small" style="font-weight:700">Gesamt</div><div class="big">${eur(total)}</div>
    <div class="bar" aria-hidden="true"><i style="width:${total?Math.round(inCart/total*100):0}%"></i></div>
    <div class="lines">
      <div class="ln"><span>Im Wagen</span><b>${eur(inCart)}</b></div>
      <div class="ln"><span>Noch offen</span><b>${eur(rest)}</b></div>
      ${saved>0?`<div class="ln"><span>Gespart durch Angebote</span><b style="color:var(--good)">${eur(saved)}</b></div>`:''}
      ${sel==='alle'&&Object.keys(byStore).length>1?`<div style="height:1px;background:var(--line);margin:4px 0"></div>${Object.entries(byStore).sort((x,y)=>{const o=[...S.settings.laeden,''];return o.indexOf(x[0])-o.indexOf(y[0])}).map(([k,v])=>`<div class="ln"><span><i class="dot" style="background:${k?lcol(k):'var(--muted)'}"></i>${esc(k?lname(k):'Ohne Laden')}</span><b>${eur(v)}</b></div>`).join('')}`:''}
      ${noPrice?`<div class="ln"><span class="small">${noPrice} Artikel ohne Preis</span></div>`:''}
    </div></div>`;
  return `<div class="view-head"><h2>Einkaufsliste</h2><span class="sub">${open.length} offen</span></div>
  ${storeChips(sel,'set-elad')}
  <div class="cols"><div class="sec">
    <form class="card addbar" data-form="add-item" autocomplete="off">
      ${ic('search')}<input id="addName" placeholder="Produkt suchen oder hinzufügen" value="${esc(suggQ)}" enterkeyhint="done" aria-label="Produkt">
      ${storeSelect('addLaden',sel!=='alle'?sel:'')}
      <button class="btn sm" type="submit" aria-label="Hinzufügen">${ic('plus')}</button>
      <div class="sugg" id="sugg" hidden></div>
    </form>
    ${listHtml}
  </div><div class="side">${calc}</div></div>`;
}
function suggestions(q){
  const n=norm(q);if(n.length<2)return [];
  const res=[];
  for(const o of validOffers()){if(norm(o.titel+' '+o.produkt+' '+o.marke).includes(n))res.push({name:o.produkt&&norm(o.titel).includes(norm(o.produkt))?o.titel:o.titel||o.produkt,laden:o.laden,preis:o.preis,alt:o.alterPreis,bis:o.bis,offer:true})}
  res.sort((a,b)=>a.preis-b.preis);
  const seen=new Set(res.map(r=>norm(r.name)+r.laden));
  for(const h of S.verlauf){if(norm(h.name).includes(n)&&!seen.has(norm(h.name)+(h.laden||''))){seen.add(norm(h.name)+(h.laden||''));res.push({name:h.name,laden:h.laden||'',preis:S.preise[norm(h.name)+'|'+(h.laden||'')]??null})}}
  return res.slice(0,8);
}
function showSugg(){
  const box=$('#sugg');if(!box)return;
  const list=suggestions(suggQ);
  if(!list.length){box.hidden=true;return}
  box.hidden=false;
  box.innerHTML=list.map((s,i)=>`<button type="button" data-act="pick-sugg" data-i="${i}"><i class="dot" style="background:${s.laden?lcol(s.laden):'var(--muted)'}"></i><span class="nm">${esc(s.name)}<br><small>${esc(s.laden?lname(s.laden):'Ohne Laden')}${s.offer?` · Angebot${s.bis?' bis '+fmtDate(s.bis):''}`:' · früher gekauft'}</small></span>${s.preis!=null?`<span class="pr" style="${s.offer?'':'color:var(--muted)'}">${eur(s.preis)}</span>`:''}</button>`).join('');
  box._list=list;
}
function addItem(name,laden,extra={}){
  name=name.trim();if(!name)return;
  const key=norm(name)+'|'+(laden||'');
  const it={id:uid(),name,menge:1,laden:laden||'',preis:S.preise[key]??null,angebotPreis:null,angebotBis:null,notiz:'',done:false,added:Date.now(),...extra};
  S.einkauf.unshift(it);
  S.verlauf=[{name,laden:laden||''},...S.verlauf.filter(h=>!(norm(h.name)===norm(name)&&(h.laden||'')===(laden||'')))].slice(0,200);
  save();
}

  ${GH.on?`<button class="btn ghost" data-act="${onWatch?'':'watch-item'}" data-id="${it.id}" ${onWatch?'disabled':''}>${ic('bell')}${onWatch?'Steht auf der Merkliste':'Angebote dafür suchen'}</button>`:''}

/* ----- Angebote ----- */
function vAngebote(){
  const head=`<div class="view-head"><h2>Angebote</h2>${S.angebote?.aktualisiert?`<span class="sub">Stand ${fmtDT(S.angebote.aktualisiert)}</span>`:''}</div>`;
  if(!GH.on)return head+`<div class="card empty"><div class="em">🔗</div><b>Noch nicht verbunden</b>Damit jeden Montag um 6 Uhr die Prospekte für dich durchsucht werden, gib einmal deinen Zugangscode in den Optionen ein.<div style="margin-top:14px"><button class="btn" data-tab="einstellungen">Zu den Optionen</button></div></div>`;
  const sel=S.settings.angLaden;
  const watch=(S.merkliste?.produkte||[]).map(p=>p.name||p);
  const a=S.angebote;
  const status=searching?`<div class="card banner"><span class="spin"></span><span class="grow"><b>Suche läuft…</b> Die neuen Preise erscheinen in ein paar Minuten von selbst.</span></div>`
    :a&&a.status==='fehler'?`<div class="card banner"><span class="tag bad">Problem</span><span class="grow">Die letzte Suche hat nicht geklappt. Gezeigt werden die letzten gefundenen Angebote. Sag Larsen Bescheid, falls das länger so bleibt.</span></div>`:'';
  const watchHtml=`<div class="card pad sec"><h3 class="mt0" style="margin:0">Merkliste</h3>
    <p class="note">Für diese Produkte werden jeden Montag um 6 Uhr die Prospekte durchsucht. Neue Produkte werden sofort gesucht.</p>
    <form class="addbar" data-form="add-watch" style="padding:4px 4px 4px 12px;border:1px solid var(--line);border-radius:16px" autocomplete="off">${ic('plus')}<input id="watchName" placeholder="z. B. Nutella, Kaffee, Zahnpasta" enterkeyhint="done" aria-label="Produkt für die Merkliste"><button class="btn sm" type="submit">Hinzufügen</button></form>
    ${watch.length?`<div class="chips" style="flex-wrap:wrap">${watch.map(n=>`<span class="chip" style="cursor:default">${esc(n)}<button class="icon-btn" style="width:22px;height:22px" data-act="unwatch" data-name="${esc(n)}" aria-label="${esc(n)} entfernen">${ic('x')}</button></span>`).join('')}</div>`:'<p class="note">Noch leer.</p>'}
    <div class="flex"><button class="btn ghost sm" data-act="search-now" ${searching?'disabled':''}>${ic('refresh')}Jetzt suchen</button><button class="btn ghost sm" data-act="reload">Neu laden</button></div></div>`;
  let body='';
  if(!a||!a.produkte||!a.produkte.length){body=`<div class="card empty"><div class="em">🏷️</div><b>${a?'Noch keine Angebote':'Angebote werden geladen'}</b>${a?'Füge Produkte zur Merkliste hinzu. Die Suche startet dann sofort.':'Einen Moment…'}</div>`}
  else{
    const t=todayIso();
    body=a.produkte.map(p=>{
      const offs=(p.angebote||[]).filter(o=>(!o.bis||o.bis>=t)&&(sel==='alle'||o.laden===sel)&&S.settings.laeden.includes(o.laden));
      return `<div class="card list"><div class="prod-h"><h3>${esc(p.name)}</h3>${offs.length?`<span class="tag deal">${offs.length} ${offs.length===1?'Angebot':'Angebote'}</span>`:''}</div>
      ${offs.length?offs.map(o=>{const off=o.alterPreis?Math.round((1-o.preis/o.alterPreis)*100):0;return `<div class="offer"><i class="dot" style="background:${lcol(o.laden)}"></i><div class="body"><div class="t">${esc(o.titel)}</div><div class="m">${esc(lname(o.laden))}${o.marke&&!norm(o.titel).includes(norm(o.marke))?' · '+esc(o.marke):''}${o.bis?' · bis '+fmtDate(o.bis,{weekday:'short',day:'numeric',month:'short'}):''}${o.grundpreis?` · ${eur(o.grundpreis)}/${esc(o.einheit||'Einheit')}`:''}</div>${off>0?`<span class="tag deal" style="margin-top:4px;display:inline-block">−${off} %</span>`:''}</div>
        <div class="pr"><b>${eur(o.preis)}</b>${o.alterPreis?`<s>${eur(o.alterPreis)}</s>`:''}</div>
        <button class="icon-btn" data-act="offer-to-list" data-p="${esc(p.name)}" data-l="${o.laden}" data-pr="${o.preis}" data-bis="${o.bis||''}" data-alt="${o.alterPreis||''}" aria-label="Auf die Einkaufsliste">${ic('cart')}</button></div>`}).join('')
      :`<div class="offer"><div class="body"><div class="m">Diese Woche kein Angebot${sel!=='alle'?' bei '+esc(lname(sel)):''}.</div></div></div>`}</div>`}).join('');
  }
  return head+status+storeChips(sel,'set-alad')+`<div class="cols"><div class="sec">${body}</div><div class="side">${watchHtml}</div></div>`;
}

/* ----- Termine ----- */
function evOn(d){return S.termine.filter(e=>e.date===d).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
function vTermine(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const first=new Date(y,m,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const t=todayIso();let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=iso(d),evs=evOn(ds);
    cells+=`<button class="day ${d.getMonth()!==m?'out':''} ${ds===t?'today':''} ${ds===calSel?'sel':''}" data-act="sel-day" data-d="${ds}" aria-label="${d.toLocaleDateString('de-DE',{day:'numeric',month:'long'})}${evs.length?', '+evs.length+' Termine':''}">${d.getDate()}${evs.length?`<span class="dots">${evs.slice(0,3).map(e=>`<i style="background:${ds===calSel?'currentColor':e.color}"></i>`).join('')}</span>`:''}</button>`;
    if(i===34&&new Date(start.getTime()+35*864e5).getMonth()!==m)break;}
  const evRow=e=>`<div class="ev" data-act="edit-ev" data-id="${e.id}"><i class="stripe" style="background:${e.color}"></i><div class="time">${e.time?esc(e.time):'ganz&shy;tägig'}</div><div style="min-width:0;flex:1"><div class="t">${esc(e.title)}</div>${e.ort||e.notiz?`<div class="m">${esc([e.ort,e.notiz].filter(Boolean).join(' · '))}</div>`:''}</div></div>`;
  const dayEv=evOn(calSel);
  const upcoming=S.termine.filter(e=>e.date>=t).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,8);
  const cal=`<div class="card pad"><div class="cal-head"><button class="icon-btn" data-act="cal-prev" aria-label="Vorheriger Monat">${ic('left')}</button><b>${calMonth.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><button class="icon-btn" data-act="cal-next" aria-label="Nächster Monat">${ic('right')}</button></div>
    <div class="cal-grid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>
    <div class="flex" style="margin-top:10px"><button class="btn ghost sm" data-act="cal-today">Heute</button><button class="btn sm right" data-act="new-ev">${ic('plus')}Termin</button></div></div>`;
  return `<div class="view-head"><h2>Termine</h2><span class="sub">${upcoming.length?upcoming.length+' anstehend':''}</span></div>
  <div class="cols"><div class="sec">${cal}
    <div class="group-h" style="padding:4px 4px 0">${fmtDate(calSel,{weekday:'long',day:'numeric',month:'long'})}</div>
    ${dayEv.length?`<div class="card list">${dayEv.map(evRow).join('')}</div>`:`<div class="card empty" style="padding:20px"><b style="font-size:16px">Nichts geplant</b><button class="btn ghost sm" style="margin-top:8px" data-act="new-ev">${ic('plus')}Termin an diesem Tag</button></div>`}
  </div><div class="side sec"><div class="group-h" style="padding:4px 4px 0">Als Nächstes</div>
    ${upcoming.length?`<div class="card list">${upcoming.map(e=>evRow(e).replace('<div class="time">',`<div class="time" style="min-width:58px">${fmtDate(e.date,{day:'numeric',month:'short'})}<br>`)).join('')}</div>`:`<div class="card empty" style="padding:20px">Keine anstehenden Termine.</div>`}
  </div></div>`;
}

  <div class="card pad sec"><h3>Farbthema</h3>
    <div class="themes">${Object.entries(THEMES).map(([k,t])=>`<button class="theme" data-act="set-theme" data-v="${k}" aria-pressed="${st.theme===k}"><div class="sw" style="background:${t.bg}"><i style="background:${t.accent}"></i><i style="background:${t.soft}"></i><i style="background:${t.text}"></i></div><span>${t.name}</span></button>`).join('')}</div>
    <div class="field"><label>Eigene Akzentfarbe</label><div class="colorrow"><input type="color" id="accentPick" value="${st.accent||(THEMES[st.theme]||THEMES.latte).accent}" aria-label="Akzentfarbe wählen"><div class="swatches">${SWATCH.map(c=>`<button data-act="set-accent" data-v="${c}" style="background:${c}" aria-pressed="${st.accent===c}" aria-label="Farbe ${c}"></button>`).join('')}</div></div>
    ${st.accent?`<button class="btn ghost sm" style="align-self:flex-start" data-act="set-accent" data-v="">Themenfarbe zurück</button>`:''}</div>
    <div class="field"><label>Hell oder dunkel</label><div class="seg">${[['auto','Automatisch'],['hell','Hell'],['dunkel','Dunkel']].map(([k,l])=>`<button data-act="set-mode" data-v="${k}" aria-pressed="${st.mode===k}" ${THEMES[st.theme]?.dark?'disabled':''}>${l}</button>`).join('')}</div></div>
  </div>
  <div class="card pad sec"><h3>Muster</h3>
    <div class="pats">${Object.entries(PATTERNS).map(([k,l])=>`<button class="pat" data-act="set-pattern" data-v="${k}" aria-pressed="${st.pattern===k}" style="background-image:${patternImg(k,dark?'#ffffff':(st.accent||(THEMES[st.theme]||THEMES.latte).accent))};background-size:${PSIZE[k]||'28px'}"><span>${l}</span></button>`).join('')}</div>
    <div class="field"><label for="patOp">Stärke</label><input type="range" id="patOp" min="10" max="100" value="${st.patOp}"></div>
  </div></div>
  <div class="side sec">
  <div class="card pad sec"><h3>Läden</h3><p class="note">Diese Läden erscheinen in der Liste und bei den Angeboten.</p>
    <div class="chips" style="flex-wrap:wrap">${Object.keys(LAEDEN).map(k=>`<button class="chip" data-act="toggle-laden" data-v="${k}" aria-pressed="${st.laeden.includes(k)}"><i class="dot" style="background:${lcol(k)}"></i>${esc(lname(k))}</button>`).join('')}</div></div>
  <div class="card pad sec"><h3>Verbindung für Angebote</h3>
    ${GH.on?`<div class="flex"><span class="tag ${syncState==='fehler'?'bad':'deal'}">${syncState==='fehler'?'Fehler':'Verbunden'}</span><span class="muted small">${esc(st.repo)}</span></div>
      <p class="note">Dein Zugangscode ist nur auf diesem Gerät gespeichert.</p>
      <div class="flex"><button class="btn ghost sm" data-act="reload">${ic('refresh')}Testen</button><button class="btn danger sm" data-act="disconnect">Trennen</button></div>`
    :`<p class="note">Gib hier einmal den Zugangscode (Token) ein, den du von Larsen bekommen hast. Danach werden deine Angebote jeden Montag automatisch aktualisiert.</p>
      <div class="field"><label for="tokenIn">Zugangscode</label><input id="tokenIn" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…"></div>
      <details><summary class="muted small" style="cursor:pointer;font-weight:700">Erweitert</summary><div class="field" style="margin-top:8px"><label for="repoIn">Daten-Repo</label><input id="repoIn" value="${esc(st.repo)}" autocapitalize="off" spellcheck="false"></div></details>
      <button class="btn" data-act="connect">${ic('link')}Verbinden</button>`}
  </div>
  <div class="card pad sec"><h3>Daten</h3><p class="note">Liste, Termine und To-dos sind auf diesem Gerät gespeichert. Sichere sie ab und zu.</p>
    <div class="flex"><button class="btn ghost sm" data-act="export">Sichern</button><label class="btn ghost sm" style="cursor:pointer">Wiederherstellen<input type="file" id="importIn" accept="application/json,.json" hidden></label><button class="btn danger sm" data-act="reset">Alles löschen</button></div></div>
  <p class="muted small" style="text-align:center;margin:0">Emmas Planner · Version ${VERSION} · mit ♥ gemacht</p>
  </div></div>`;
}

/* ---------- Sheets ---------- */
let sheetData={};
function openSheet(html){closeSheet();sheetData={};const s=document.createElement('div');s.className='scrim';s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;s.addEventListener('click',e=>{if(e.target===s)closeSheet()});document.body.appendChild(s);const f=s.querySelector('input:not([type=hidden])');if(f&&!f.value&&matchMedia('(hover:hover)').matches)f.focus()}
function closeSheet(){document.querySelectorAll('.scrim').forEach(s=>s.remove())}
const val=id=>{const e=document.getElementById(id);return e?e.value:''};

/* ---------- Aktionen ---------- */
document.addEventListener('click',async e=>{
  const tb=e.target.closest('[data-tab]');if(tb){closeSheet();go(tb.dataset.tab);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  const item=()=>S.einkauf.find(x=>x.id===id);
  switch(a){
    case'close':closeSheet();break;
    // Einkauf
    case'set-elad':S.settings.einkaufLaden=b.dataset.v;save();render();break;
    case'toggle-item':{const it=item();if(it){it.done=!it.done;save();render()}break}
    case'edit-item':{const it=item();if(it)itemSheet(it);break}
    case'save-item':{const it=item();if(!it)break;const name=val('f-name').trim();if(!name){toast('Bitte einen Namen eingeben');break}
      Object.assign(it,{name,menge:Math.max(1,parseInt(val('f-menge'))||1),laden:val('f-laden'),preis:num(val('f-preis')),angebotPreis:num(val('f-apreis')),angebotBis:val('f-abis')||null,notiz:val('f-notiz').trim()});
      if(it.preis!=null)S.preise[norm(it.name)+'|'+(it.laden||'')]=it.preis;
      save();closeSheet();render();break}
    case'use-offer':{const o=sheetData.offers&&sheetData.offers[+b.dataset.i];if(!o)break;const set=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v};
      set('f-apreis',String(o.preis).replace('.',','));set('f-abis',o.bis||'');if(o.alterPreis&&!val('f-preis'))set('f-preis',String(o.alterPreis).replace('.',','));toast('Übernommen – jetzt speichern');break}
    case'del-item':S.einkauf=S.einkauf.filter(x=>x.id!==id);save();closeSheet();render();break;
    case'watch-item':{const it=item();if(it){b.disabled=true;await addWatch(it.name);closeSheet();render()}break}
    case'clear-done':{const n=S.einkauf.filter(x=>x.done).length;S.einkauf=S.einkauf.filter(x=>!x.done);save();render();toast(n+' Artikel entfernt');break}
    case'pick-sugg':{const s=$('#sugg')._list[+b.dataset.i];if(!s)break;
      addItem(s.name,s.laden,s.offer?{angebotPreis:s.preis,angebotBis:s.bis||null,preis:s.alt||S.preise[norm(s.name)+'|'+s.laden]||null}:{});suggQ='';render();toast(`„${s.name}“ hinzugefügt`);break}
    // Angebote
    case'set-alad':S.settings.angLaden=b.dataset.v;save();render();break;
    case'unwatch':b.disabled=true;await removeWatch(b.dataset.name);break;
    case'search-now':{b.disabled=true;const ok=await editMerkliste(d=>{d.suche=new Date().toISOString()},'Suche per Hand gestartet');if(ok){toast('Suche gestartet');startPolling()}else render();break}
    case'reload':await loadRemote(false);if(syncState==='ok')toast('Alles aktuell');break;
    case'offer-to-list':{const d=b.dataset;addItem(d.p,d.l,{angebotPreis:num(d.pr),angebotBis:d.bis||null,preis:num(d.alt)??S.preise[norm(d.p)+'|'+d.l]??null});toast(`${d.p} (${lname(d.l)}) ist auf der Einkaufsliste`);break}
    // Termine
    case'sel-day':calSel=b.dataset.d;{const d=new Date(calSel+'T12:00');if(d.getMonth()!==calMonth.getMonth()){calMonth=new Date(d.getFullYear(),d.getMonth(),1)}}render();break;
    case'cal-prev':calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);render();break;
    case'cal-next':calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);render();break;
    case'cal-today':calSel=todayIso();calMonth=new Date();calMonth.setDate(1);render();break;
    case'new-ev':evSheet(null);break;
    case'edit-ev':{const ev=S.termine.find(x=>x.id===id);if(ev)evSheet(ev);break}
    case'pick-evcol':sheetData.evColor=b.dataset.c;document.querySelectorAll('#e-colors button').forEach(x=>x.setAttribute('aria-pressed',x===b));break;
    case'save-ev':{const title=val('e-title').trim(),date=val('e-date');if(!title||!date){toast('Titel und Datum bitte');break}
      const ev={id,title,date,time:val('e-time'),ort:val('e-ort').trim(),notiz:val('e-notiz').trim(),color:sheetData.evColor||EV_COLORS[0]};
      const i=S.termine.findIndex(x=>x.id===id);if(i>=0)S.termine[i]=ev;else S.termine.push(ev);
      calSel=date;calMonth=new Date(date.slice(0,4),+date.slice(5,7)-1,1);save();closeSheet();render();break}
    case'del-ev':S.termine=S.termine.filter(x=>x.id!==id);save();closeSheet();render();break;
    // To-dos
    case'toggle-todo':{const x=S.todos.find(t=>t.id===id);if(x){x.done=!x.done;x.doneAt=x.done?Date.now():null;save();render()}break}
    case'edit-todo':{const x=S.todos.find(t=>t.id===id);if(x)todoSheet(x);break}
    case'save-todo':{const x=S.todos.find(t=>t.id===id);if(!x)break;const text=val('t-text').trim();if(!text){toast('Bitte einen Text eingeben');break}Object.assign(x,{text,due:val('t-due')||null,prio:+val('t-prio')||1});save();closeSheet();render();break}
    case'del-todo':S.todos=S.todos.filter(x=>x.id!==id);save();closeSheet();render();break;
    case'todo-filter':S.settings.todoFilter=b.dataset.v;save();render();break;
    case'clear-todos':S.todos=S.todos.filter(x=>!x.done);save();render();break;
    // Einstellungen
    case'set-theme':S.settings.theme=b.dataset.v;S.settings.accent=null;save();applyTheme();render();break;
    case'set-accent':S.settings.accent=b.dataset.v||null;save();applyTheme();render();break;
    case'set-mode':S.settings.mode=b.dataset.v;save();applyTheme();render();break;
    case'set-pattern':S.settings.pattern=b.dataset.v;save();applyTheme();render();break;
    case'toggle-laden':{const k=b.dataset.v,l=S.settings.laeden;if(l.includes(k)){if(l.length===1){toast('Mindestens ein Laden');break}S.settings.laeden=l.filter(x=>x!==k)}else S.settings.laeden=Object.keys(LAEDEN).filter(x=>x===k||l.includes(x));
      if(!S.settings.laeden.includes(S.settings.einkaufLaden))S.settings.einkaufLaden='alle';if(!S.settings.laeden.includes(S.settings.angLaden))S.settings.angLaden='alle';save();render();break}
    case'connect':{const tk=val('tokenIn').trim(),repo=(val('repoIn')||DEFAULT_REPO).trim();if(!tk){toast('Bitte den Zugangscode eingeben');break}
      b.disabled=true;b.innerHTML='<span class="spin"></span>Verbinde…';
      const old={...S.settings};S.settings.token=tk;S.settings.repo=repo;
      try{await GH.readJson('merkliste.json');save();toast('Verbunden ✿');await loadRemote(true);render()}
      catch(err){S.settings.token=old.token;S.settings.repo=old.repo;toast(ghError(err));render()}
      break}
    case'disconnect':if(confirmTwice(b,'Wirklich trennen?')){S.settings.token='';S.merkliste=null;S.angebote=null;save();setSync('');render();toast('Getrennt')}break;
    case'export':{const data=JSON.stringify({...S,settings:{...S.settings,token:''}},null,1);const blob=new Blob([data],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='emmas-planner-'+todayIso()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
    case'reset':if(confirmTwice(b,'Sicher? Nochmal tippen')){const tk=S.settings.token,repo=S.settings.repo;S=JSON.parse(JSON.stringify(DEF));S.welcome=true;S.settings.token=tk;S.settings.repo=repo;save();applyTheme();render();toast('Alles gelöscht')}break;
  }
});
function confirmTwice(b,msg){if(b.dataset.armed){return true}b.dataset.armed=1;const t=b.textContent;b.textContent=msg;setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t}},3500);return false}
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form;
  if(k==='add-item'){const n=val('addName').trim();if(!n)return;addItem(n,val('addLaden'));suggQ='';render();const inp=$('#addName');inp&&inp.focus();toast(`„${n}“ hinzugefügt`)}
  if(k==='add-todo'){const t=val('todoText').trim();if(!t)return;S.todos.unshift({id:uid(),text:t,done:false,prio:1,due:null,created:Date.now()});if(S.settings.todoFilter==='erledigt')S.settings.todoFilter='offen';save();render();const inp=$('#todoText');inp&&inp.focus()}
  if(k==='add-watch'){const n=val('watchName').trim();if(!n)return;const btn=f.querySelector('button');btn.disabled=true;await addWatch(n);render()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='addName'){suggQ=e.target.value;showSugg()}
  if(e.target.id==='patOp'){S.settings.patOp=+e.target.value;save();applyTheme()}
  if(e.target.id==='accentPick'){S.settings.accent=e.target.value;save();applyTheme()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='accentPick')render();
  if(e.target.id==='importIn'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.einkauf))throw 0;const tk=S.settings.token,repo=S.settings.repo;S=Object.assign({},DEF,d);S.settings=Object.assign({},DEF.settings,d.settings||{},{token:tk,repo});save();applyTheme();render();toast('Wiederhergestellt')}catch(err){toast('Diese Datei passt nicht')}};r.readAsText(e.target.files[0])}
});
document.addEventListener('focusin',e=>{if(e.target.id==='addName')showSugg()});
document.addEventListener('pointerdown',e=>{const box=$('#sugg');if(box&&!box.hidden&&!e.target.closest('.addbar'))box.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
let lastLoad=0;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){header();if(GH.on&&Date.now()-lastLoad>5*60e3){lastLoad=Date.now();loadRemote(true)}}});

/* ---------- Start ---------- */
applyTheme();render();
if(GH.on){setSync('laden');lastLoad=Date.now();loadRemote(true)}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
